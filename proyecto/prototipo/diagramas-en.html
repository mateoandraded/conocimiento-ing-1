<!DOCTYPE html>

<style>

.d{display:none}.d.on{display:block}
.box,.ext,.us,.solid{fill:#fff;stroke:#000;stroke-width:1}

<svg width="0" height="0" style="position:absolute"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs></svg>

<rect class="box" x="320" y="200" width="210" height="64" rx="0"/><text class="t" x="425" y="228">Web application</text><text class="s" x="425" y="246">apps/web, React + TypeScript</text>
<rect x="620" y="120" width="200" height="110" rx="0" class="solid"/><text class="tw" x="720" y="168">Back-end API</text><text x="720" y="190" font-size="13" fill="#000" text-anchor="middle">apps/api, FastAPI, JWT</text>
<rect class="box" x="620" y="320" width="200" height="64" rx="0"/><text class="t" x="720" y="348">PostgreSQL database</text><text class="s" x="720" y="366">client's VPS, port 5433</text>

<path class="l both" d="M230,92 L320,72"/><path class="l both" d="M230,100 L320,222"/><path class="l both" d="M230,362 L320,240"/>
<path class="l both" d="M530,72 L620,150"/><text class="e" x="540" y="100">HTTPS, REST/JSON</text>
<path class="l both" d="M530,232 L620,200"/><text class="e" x="535" y="262">HTTPS, REST/JSON</text>

<path class="l both" d="M820,175 L880,175"/><text class="e" x="822" y="166">HTTPS</text>
<text x="30" y="450" font-size="13" fill="#000">Solid boxes: users and components built by the team. Dashed box: external service. The AI service receives no patient identifiers (NFR-15).</text>
</svg></div>

</g>
